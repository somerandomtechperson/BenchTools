<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#101827">
<title>BenchTools — Engineering Toolkit</title>
<style>
:root{color-scheme:light dark;--bg:#f3f6fb;--panel:#fff;--panel2:#f7f9fc;--text:#172033;--muted:#657188;--line:#dfe6ef;--accent:#1677e8;--accent2:#e7f1ff;--good:#17845b;--warn:#b76b08;--bad:#c43e4d;--shadow:0 8px 28px #1c35520d}
@media(prefers-color-scheme:dark){:root{--bg:#0b111b;--panel:#121b29;--panel2:#172233;--text:#eaf0f8;--muted:#9cacc2;--line:#2a394d;--accent:#65b2ff;--accent2:#183655;--good:#65d6a4;--warn:#f5bb68;--bad:#ff8791;--shadow:0 8px 28px #0003}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.app{min-height:100vh}.topbar{height:68px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:11px;min-width:220px}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2489f5,#0759bd);display:grid;place-items:center;color:white;font-size:21px;box-shadow:0 5px 15px #1677e833}.brand strong{font-size:17px;letter-spacing:-.4px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.2px;font-weight:700}.search{flex:1;max-width:580px;position:relative}.search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text)}.search span{position:absolute;left:13px;top:8px;color:var(--muted);font-size:17px}.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}.pill{font-size:11px;border:1px solid var(--line);padding:5px 9px;border-radius:999px;color:var(--muted);white-space:nowrap}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);max-width:1500px;margin:auto;min-height:calc(100vh - 68px)}aside{border-right:1px solid var(--line);padding:22px 14px;background:var(--panel)}.nav-label{font-size:10px;letter-spacing:1.4px;font-weight:800;color:var(--muted);padding:10px 12px}.nav{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);text-align:left;margin:2px 0}.nav:hover{background:var(--panel2);color:var(--text)}.nav.active{background:var(--accent2);color:var(--accent);font-weight:700}.nav .ico{width:20px;text-align:center;font-size:16px}.nav .count{margin-left:auto;font-size:11px}.side-note{margin:28px 7px 0;padding:13px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}.side-note strong{display:block;color:var(--text);margin-bottom:5px}.main{padding:30px clamp(16px,3vw,38px) 50px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:24px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;font-weight:800;color:var(--accent);margin-bottom:5px}.page-head h1{margin:0;font-size:clamp(25px,3vw,32px);letter-spacing:-1px;line-height:1.2}.page-head p{margin:8px 0 0;color:var(--muted);max-width:650px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:9px 13px;font-weight:650}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.small{font-size:12px;padding:6px 9px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.tool-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:19px;text-align:left;color:var(--text);box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-height:170px}.tool-card:hover{transform:translateY(-2px);border-color:var(--accent)}.card-icon{width:42px;height:42px;border-radius:12px;background:var(--accent2);color:var(--accent);display:grid;place-items:center;font-size:21px;margin-bottom:14px}.tool-card h3{margin:0 0 5px;font-size:15px}.tool-card p{margin:0;color:var(--muted);font-size:12px}.tag{display:inline-block;margin-top:14px;font-size:10px;color:var(--muted);background:var(--panel2);border:1px solid var(--line);padding:3px 7px;border-radius:5px}.workspace{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(270px,.85fr);gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:21px;box-shadow:var(--shadow);min-width:0}.panel h2{font-size:15px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted);margin:0 0 19px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{min-width:0}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:10px 11px;min-width:0}.field .unit{font-size:11px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:13px;min-width:0}.metric span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.metric strong{display:block;font-size:clamp(17px,2vw,23px);letter-spacing:-.5px;overflow-wrap:anywhere}.metric small{color:var(--muted);font-size:11px}.formula{padding:12px 13px;background:var(--accent2);color:var(--text);border-radius:9px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px;margin-top:14px;overflow-wrap:anywhere}.diagram{margin-top:15px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px;min-height:125px;display:grid;place-items:center}.diagram svg{width:100%;max-width:420px;height:auto}.message{padding:11px 13px;border-radius:9px;font-size:12px;margin-top:12px;background:var(--panel2);color:var(--muted)}.message.error{color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}.saved-list{display:grid;gap:10px}.saved-item{border:1px solid var(--line);border-radius:10px;padding:13px;display:flex;gap:10px;align-items:flex-start}.saved-item .saved-body{flex:1;min-width:0}.saved-item strong{display:block;font-size:13px}.saved-item small{color:var(--muted);display:block;margin-top:3px;overflow-wrap:anywhere}.saved-item .saved-actions{display:flex;gap:5px}.empty{padding:35px 12px;text-align:center;color:var(--muted)}.empty .big{font-size:30px;margin-bottom:8px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 13px}.section-title h2{margin:0;font-size:16px}.home-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.stat span{display:block;font-size:11px;color:var(--muted)}.stat strong{font-size:22px;display:block;margin-top:4px}.color-bands{display:flex;height:72px;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:16px}.color-band{flex:1;min-width:0;position:relative}.color-band span{position:absolute;inset:auto 0 5px;text-align:center;font-size:9px;color:#fff;text-shadow:0 1px 3px #000}.swatch{display:inline-block;width:15px;height:15px;border-radius:4px;vertical-align:middle;margin-right:6px;border:1px solid #7776}.footnote{color:var(--muted);font-size:11px;margin-top:18px}.mobile-nav{display:none}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace{grid-template-columns:1fr}.brand{min-width:175px}.layout{grid-template-columns:210px minmax(0,1fr)}}
@media(max-width:700px){.topbar{height:auto;min-height:62px;padding:10px 14px;flex-wrap:wrap;gap:10px}.brand{min-width:0}.brand small{display:none}.search{order:3;flex-basis:100%;max-width:none}.top-actions .pill{display:none}.layout{display:block}.layout aside{display:none}.main{padding:22px 14px 40px}.cards{grid-template-columns:1fr}.tool-card{min-height:0}.page-head{flex-direction:column}.form-grid{grid-template-columns:1fr}.home-stats{grid-template-columns:1fr 1fr}.home-stats .stat:last-child{display:none}.mobile-nav{display:flex;overflow:auto;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}.mobile-nav .nav{white-space:nowrap;width:auto;flex-shrink:0;margin:0;padding:8px 10px}.panel{padding:16px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="logo">⌁</div><div><strong>BenchTools</strong><small>ENGINEERING TOOLKIT</small></div></div>
  <div class="search"><span>⌕</span><input id="search" type="search" placeholder="Search tools…  (try “LED” or “battery”)" aria-label="Search tools"></div>
  <div class="top-actions"><span class="pill">V1.0 · OFFLINE READY</span><button class="btn small" id="exportTop">Export</button></div>
</header>
<div class="mobile-nav" id="mobileNav"></div>
<div class="layout">
<aside>
  <div class="nav-label">WORKSPACE</div>
  <button class="nav active" data-page="home"><span class="ico">⌂</span>Overview</button>
  <button class="nav" data-page="saved"><span class="ico">▣</span>Saved calculations <span class="count" id="savedCount">0</span></button>
  <div class="nav-label">CALCULATORS</div>
  <div id="sideTools"></div>
  <div class="side-note"><strong>Built for the workbench.</strong>Fast, local calculations for electronics, RC projects, and everyday making. No account required.</div>
</aside>
<main class="main" id="main"></main>
</div>
</div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const tools = [
 {id:'ohms',name:"Ohm's Law",icon:'ϟ',desc:'Solve voltage, current, resistance, and power.',tag:'ELECTRONICS'},
 {id:'battery',name:'Battery Calculator',icon:'▣',desc:'Estimate energy, runtime, and cell-pack voltage.',tag:'POWER'},
 {id:'gearing',name:'RC Gearing',icon:'⚙',desc:'Calculate ratio, wheel RPM, and theoretical speed.',tag:'RC WORKSHOP'},
 {id:'units',name:'Unit Converter',icon:'⇄',desc:'Convert common engineering and workshop units.',tag:'REFERENCE'},
 {id:'led',name:'LED Resistor',icon:'◉',desc:'Choose a current-limiting resistor and power rating.',tag:'ELECTRONICS'},
 {id:'resistor',name:'Resistor Decoder',icon:'▥',desc:'Read 4-band and 5-band resistor color codes.',tag:'REFERENCE'}
];
let page='home', activeTool='ohms', lastResult=null;
let saved = loadSaved();
function loadSaved(){try{return JSON.parse(localStorage.getItem('benchtools.saved')||'[]')}catch{return []}}
function persist(){try{localStorage.setItem('benchtools.saved',JSON.stringify(saved))}catch{}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){if(v===null||v===undefined||String(v).trim()==='')return NaN;return Number(v)}
function fmt(v,unit='',sig=5){if(!Number.isFinite(v))return '—';let a=Math.abs(v);let s=a!==0&&(a>=1e6||a<0.001)?v.toExponential(3):Number(v.toPrecision(sig)).toLocaleString('en-US',{maximumFractionDigits:6});return s+(unit?' '+unit:'')}
function field(id,label,value,unit='',type='number',step='any',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" ${type==='number'?`step="${step}"`:''} value="${value??''}" ${extra}>${unit?`<div class="unit">${unit}</div>`:''}</div>`}
function selectField(id,label,opts){return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>`}
function panel(title,sub,content){return `<section class="panel"><h2>${title}</h2><p class="sub">${sub}</p>${content}</section>`}
function metric(label,value,sub=''){return `<div class="metric"><span>${label}</span><strong>${value}</strong>${sub?`<small>${sub}</small>`:''}</div>`}
function actions(){return `<div class="actions"><button class="btn primary" id="calculate">Calculate</button><button class="btn" id="saveResult">Save calculation</button><button class="btn" id="reset">Reset</button></div><div id="message" class="message" role="status">Enter your values and calculate.</div>`}
function resultPanel(title,content,formula='',diagram=''){return panel(title,'Live result preview',`<div id="results" class="result-grid">${content}</div>${formula?`<div class="formula" id="formula">${formula}</div>`:''}${diagram?`<div class="diagram" id="diagram">${diagram}</div>`:''}<p class="footnote">Results are estimates based on the values entered. Verify ratings and manufacturer specifications before building a circuit or vehicle.</p>`)}
const circuitSvg=`<svg viewBox="0 0 420 120" role="img" aria-label="Simple DC circuit diagram"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M78 27H157 M213 27H335V93H78V27"/><path d="M157 17V37 M169 11V43 M169 27H213"/><rect x="183" y="81" width="48" height="24" rx="3" fill="var(--accent2)" stroke="var(--accent)"/><path d="M78 93V62 M71 62H85 M74 56H82"/></g><g fill="currentColor" font-size="11"><text x="128" y="15">DC source</text><text x="190" y="76">R</text><text x="247" y="116">Current path</text></g><circle cx="268" cy="27" r="4" fill="var(--accent)"/></svg>`;
function home(){return `<div class="page-head"><div><div class="eyebrow">YOUR WORKSPACE</div><h1>Engineering, made simpler.</h1><p>A practical set of fast, reliable calculators for electronics, RC projects, and workshop measurements.</p></div><button class="btn primary" data-open="ohms">Open a calculator ↗</button></div>
<div class="home-stats"><div class="stat"><span>AVAILABLE TOOLS</span><strong>06</strong></div><div class="stat"><span>SAVED CALCULATIONS</span><strong>${saved.length}</strong></div><div class="stat"><span>ACCOUNT REQUIRED</span><strong>No</strong></div></div>
<div class="section-title"><h2>Calculators</h2><span class="pill">ALL TOOLS</span></div><div class="cards" id="toolCards">${tools.map(t=>`<button class="tool-card" data-open="${t.id}"><div class="card-icon">${t.icon}</div><h3>${t.name}</h3><p>${t.desc}</p><span class="tag">${t.tag}</span></button>`).join('')}</div>
<div class="section-title"><h2>Recently saved</h2><button class="btn small" data-page="saved">View all</button></div>${saved.length?`<div class="saved-list">${saved.slice(0,3).map(savedCard).join('')}</div>`:`<section class="panel empty"><div class="big">▣</div><strong>No saved calculations yet</strong><p>Run a calculator and save a result to keep it handy.</p></section>`}
<p class="footnote">BenchTools runs locally in your browser. Your saved calculations stay on this device unless you export them.</p>`}
function ohmsPage(){return `<div class="page-head"><div><div class="eyebrow">ELECTRONICS</div><h1>Ohm's Law</h1><p>Enter any two known electrical values to solve the remaining values. Leave unknown fields blank.</p></div><span class="pill">DC RESISTIVE CIRCUITS</span></div><div class="workspace">${panel('Input values','Enter two known values. Values must be positive, except voltage may be zero.',`<div class="form-grid">${field('v','Voltage (V)','12','Volts, V')}${field('i','Current (A)','','Amps, A')}${field('r','Resistance (Ω)','6','Ohms, Ω')}${field('p','Power (W)','','Watts, W')}</div>${actions()}`)}${resultPanel('Calculated values',metric('Voltage','12 V')+metric('Current','2 A')+metric('Resistance','6 Ω')+metric('Power','24 W'),'V = I × R   •   P = V × I',circuitSvg)}</div>`}
function batteryPage(){return `<div class="page-head"><div><div class="eyebrow">POWER</div><h1>Battery Calculator</h1><p>Estimate pack voltage, energy, and runtime from battery capacity and load.</p></div><span class="pill">ESTIMATES</span></div><div class="workspace">${panel('Battery & load','Use nominal voltage for energy estimates. Runtime assumes a steady load.',`<div class="form-grid">${field('cells','LiPo cell count','3','Cells (1S–14S)')}${field('capacity','Capacity (mAh)','2200','Milliamp-hours')}${field('load','Load current (A)','10','Average current draw')}${field('usable','Usable capacity (%)','80','Allow for reserve and losses')}</div>${actions()}`)}${resultPanel('Battery estimates',metric('Nominal voltage','11.1 V')+metric('Fully charged','12.6 V')+metric('Energy','24.42 Wh')+metric('Estimated runtime','10.6 min'),'Wh = V × Ah  •  Runtime = usable Ah ÷ load A')}</div>`}
function gearingPage(){return `<div class="page-head"><div><div class="eyebrow">RC WORKSHOP</div><h1>RC Gearing</h1><p>Estimate final drive ratio, wheel RPM, and theoretical speed from your drivetrain.</p></div><span class="pill">IDEAL CONDITIONS</span></div><div class="workspace">${panel('Drivetrain setup','Enter motor speed, tooth counts, tire size, and internal drivetrain ratio.',`<div class="form-grid">${field('rpm','Motor RPM','30000','Motor shaft RPM')}${field('pinion','Pinion teeth','19','Teeth')}${field('spur','Spur teeth','可','Teeth'.replace('可','54'))}${field('internal','Internal ratio','2.85','Transmission / differential ratio')}${field('tire','Tire diameter (mm)','100','Millimeters')}${selectField('speedUnit','Speed display',[['mph','Miles per hour (mph)'],['kmh','Kilometers per hour (km/h)']])}</div>${actions()}`)}${resultPanel('Gearing estimates',metric('Final drive ratio','8.10:1')+metric('Wheel RPM','3,704 rpm')+metric('Theoretical speed','69.9 km/h')+metric('Speed (mph)','43.4 mph'),'Final ratio = spur ÷ pinion × internal ratio')}</div>`}
const unitGroups={
 length:{label:'Length',units:[['mm','Millimeters (mm)',.001],['cm','Centimeters (cm)',.01],['m','Meters (m)',1],['km','Kilometers (km)',1000],['in','Inches (in)',.0254],['ft','Feet (ft)',.3048],['yd','Yards (yd)',.9144],['mi','Miles (mi)',1609.344]]},
 mass:{label:'Mass',units:[['mg','Milligrams (mg)',.000001],['g','Grams (g)',.001],['kg','Kilograms (kg)',1],['oz','Ounces (oz)',.028349523125],['lb','Pounds (lb)',.45359237]]},
 temp:{label:'Temperature',units:[['C','Celsius (°C)'],['F','Fahrenheit (°F)'],['K','Kelvin (K)']]},
 speed:{label:'Speed',units:[['mps','Meters per second (m/s)',1],['kmh','Kilometers per hour (km/h)',1/3.6],['mph','Miles per hour (mph)',.44704],['fps','Feet per second (ft/s)',.3048]]},
 pressure:{label:'Pressure',units:[['Pa','Pascals (Pa)',1],['kPa','Kilopascals (kPa)',1000],['bar','Bar',100000],['psi','Pounds per square inch (psi)',6894.757293],['atm','Atmospheres (atm)',101325]]},
 torque:{label:'Torque',units:[['Nm','Newton-meters (N·m)',1],['Ncm','Newton-centimeters (N·cm)',.01],['lbft','Pound-feet (lb·ft)',1.355817948],['ozin','Ounce-inches (oz·in)',.0070615518]]},
 power:{label:'Power',units:[['W','Watts (W)',1],['mW','Milliwatts (mW)',.001],['kW','Kilowatts (kW)',1000],['hp','Mechanical horsepower (hp)',745.699872]]},
 energy:{label:'Energy',units:[['J','Joules (J)',1],['Wh','Watt-hours (Wh)',3600],['kWh','Kilowatt-hours (kWh)',3600000],['cal','Calories (cal)',4.184],['kcal','Kilocalories (kcal)',4184]]}
};
function unitsPage(){return `<div class="page-head"><div><div class="eyebrow">REFERENCE</div><h1>Unit Converter</h1><p>Convert common workshop and engineering measurements without leaving the page.</p></div><span class="pill">INSTANT CONVERSION</span></div><div class="workspace">${panel('Conversion','Choose a category and units, then enter a value.',`<div class="form-grid">${selectField('category','Category',Object.entries(unitGroups).map(([k,v])=>[k,v.label]))}${field('amount','Value','1','','number','any')}${selectField('fromUnit','From unit',[])}${selectField('toUnit','To unit',[])}</div><div class="actions"><button class="btn primary" id="convert">Convert</button><button class="btn" id="swap">Swap units ⇄</button><button class="btn" id="saveResult">Save conversion</button></div><div id="message" class="message">Conversion updates as you calculate.</div>`)}${resultPanel('Converted value',metric('Result','1000 mm')+metric('Input','1 m'),'Conversions use standard unit definitions.')}</div>`}
function ledPage(){return `<div class="page-head"><div><div class="eyebrow">ELECTRONICS</div><h1>LED Resistor Calculator</h1><p>Calculate a series resistor and its power dissipation for a simple DC LED circuit.</p></div><span class="pill">SERIES CIRCUIT</span></div><div class="workspace">${panel('Circuit values','For multiple LEDs in series, enter the total forward voltage.',`<div class="form-grid">${field('supply','Supply voltage (V)','5','DC supply')}${field('forward','LED forward voltage (V)','2','Total LED forward voltage')}${field('current','Target current (mA)','20','Desired LED current')}${field('tolerance','Design margin (%)','10','Extra resistance margin')}</div>${actions()}`)}${resultPanel('Resistor recommendation',metric('Calculated resistance','150 Ω')+metric('Suggested standard value','150 Ω')+metric('Resistor power','0.06 W')+metric('Suggested rating','0.25 W'),'R = (Vsupply − VLED) ÷ I')}</div>`}
const resistorColors=[
 {name:'Black',v:0,c:'#17191d',text:'#fff'},{name:'Brown',v:1,c:'#7a4425',text:'#fff'},{name:'Red',v:2,c:'#d94343',text:'#fff'},{name:'Orange',v:3,c:'#ed852a',text:'#222'},{name:'Yellow',v:4,c:'#f4d54c',text:'#222'},{name:'Green',v:5,c:'#2c9c64',text:'#fff'},{name:'Blue',v:6,c:'#347bd1',text:'#fff'},{name:'Violet',v:7,c:'#8956c7',text:'#fff'},{name:'Grey',v:8,c:'#9299a4',text:'#222'},{name:'White',v:9,c:'#f2f4f7',text:'#222'},{name:'Gold',mult:.1,tol:5,c:'#c7a54c',text:'#222'},{name:'Silver',mult:.01,tol:10,c:'#b9c0c9',text:'#222'}];
function colorOptions(id,includeMetal=true){return resistorColors.filter(c=>includeMetal||c.v!==undefined).map(c=>`<option value="${c.name}">${c.name}</option>`).join('')}
function resistorPage(){return `<div class="page-head"><div><div class="eyebrow">REFERENCE</div><h1>Resistor Decoder</h1><p>Decode 4-band or 5-band through-hole resistors by selecting each color band.</p></div><span class="pill">EIA COLOR CODE</span></div><div class="workspace">${panel('Color bands','Select the bands from left to right. Gold and silver are commonly used for multiplier or tolerance bands.',`<div class="form-grid">${selectField('bandCount','Resistor type',[['4','4-band resistor'],['5','5-band resistor']])}${selectField('b1','Band 1 (first digit)',resistorColors.filter(c=>c.v!==undefined).map(c=>[c.name,c.name]))}${selectField('b2','Band 2 (second digit)',resistorColors.filter(c=>c.v!==undefined).map(c=>[c.name,c.name]))}<div class="field" id="b3wrap"><label for="b3">Band 3 (third digit)</label><select id="b3">${resistorColors.filter(c=>c.v!==undefined).map(c=>`<option value="${c.name}">${c.name}</option>`).join('')}</select></div>${selectField('mult','Multiplier',resistorColors.map(c=>[c.name,c.name]))}${selectField('tol','Tolerance', [['Brown','±1%'],['Red','±2%'],['Green','±0.5%'],['Blue','±0.25%'],['Violet','±0.1%'],['Grey','±0.05%'],['Gold','±5%'],['Silver','±10%']])}</div><div class="color-bands" id="colorBands"></div><div class="actions"><button class="btn primary" id="decode">Decode resistor</button><button class="btn" id="saveResult">Save result</button></div><div id="message" class="message">Choose the band colors to decode the value.</div>`)}${resultPanel('Decoded resistance',metric('Resistance','10 kΩ')+metric('Tolerance','±5%')+metric('Possible range','9.5–10.5 kΩ'),'Digits × multiplier = resistance')}</div>`}
function savedPage(){return `<div class="page-head"><div><div class="eyebrow">WORKSPACE</div><h1>Saved calculations</h1><p>Your saved results are stored locally in this browser. Export a backup to move them elsewhere.</p></div><div class="actions" style="margin-top:0"><button class="btn" id="exportText">Export text</button><button class="btn" id="exportCsv">Export CSV</button></div></div>${saved.length?`<div class="saved-list">${saved.map(savedCard).join('')}</div>`:`<section class="panel empty"><div class="big">▣</div><strong>Nothing saved yet</strong><p>Open any calculator and select “Save calculation” to add a result here.</p><button class="btn primary" data-page="home">Explore tools</button></section>`}<p class="footnote">Saved results remain in this browser's local storage. Clearing site data may remove them.</p>`}
function savedCard(s){return `<div class="saved-item"><div class="card-icon" style="width:34px;height:34px;margin:0;flex-shrink:0">${(tools.find(t=>t.id===s.tool)||{}).icon||'▣'}</div><div class="saved-body"><strong>${esc(s.title)}</strong><small>${esc(s.summary)}</small><small>${new Date(s.date).toLocaleString()}</small></div><div class="saved-actions"><button class="btn small" data-delete="${s.id}" aria-label="Delete saved calculation">Delete</button></div></div>`}
function toolPage(id){return ({ohms:ohmsPage,battery:batteryPage,gearing:gearingPage,units:unitsPage,led:ledPage,resistor:resistorPage})[id]()}
function render(){lastResult=null;const main=$('#main');main.innerHTML=page==='home'?home():page==='saved'?savedPage():toolPage(activeTool);$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='tool'&&b.dataset.tool===activeTool)));$('#savedCount').textContent=saved.length;wirePage();renderNav();if(page==='tool'&&activeTool==='units')refreshUnitOptions();if(page==='tool'&&activeTool==='resistor'){updateBandCount();updateBands();}}
function renderNav(){const side=$('#sideTools'),mobile=$('#mobileNav');side.innerHTML=tools.map(t=>`<button class="nav ${page==='tool'&&activeTool===t.id?'active':''}" data-tool="${t.id}"><span class="ico">${t.icon}</span>${t.name}</button>`).join('');mobile.innerHTML=`<button class="nav ${page==='home'?'active':''}" data-page="home">⌂ Overview</button>`+tools.map(t=>`<button class="nav ${page==='tool'&&activeTool===t.id?'active':''}" data-tool="${t.id}">${t.icon} ${t.name}</button>`).join('')+`<button class="nav ${page==='saved'?'active':''}" data-page="saved">▣ Saved</button>`;wireNav()}
function wireNav(){$$('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$$('[data-tool]').forEach(b=>b.onclick=()=>{page='tool';activeTool=b.dataset.tool;render()});$$('[data-open]').forEach(b=>b.onclick=()=>{page='tool';activeTool=b.dataset.open;render()});$$('[data-delete]').forEach(b=>b.onclick=()=>{saved=saved.filter(x=>x.id!==b.dataset.delete);persist();render()})}
function wirePage(){wireNav();const calc=$('#calculate');if(calc)calc.onclick=calculate;const reset=$('#reset');if(reset)reset.onclick=()=>{const defs={ohms:{v:'',i:'',r:'',p:''},battery:{cells:'3',capacity:'2200',load:'10',usable:'80'},gearing:{rpm:'30000',pinion:'19',spur:'54',internal:'2.85',tire:'100'},led:{supply:'5',forward:'2',current:'20',tolerance:'10'}}[activeTool];if(defs)Object.entries(defs).forEach(([k,v])=>{const el=$('#'+k);if(el)el.value=v});const m=$('#message');if(m){m.className='message';m.textContent='Values reset. Calculate to update results.'}};const save=$('#saveResult');if(save)save.onclick=saveCurrent;if($('#category'))$('#category').onchange=()=>{refreshUnitOptions();convertUnits()};if($('#convert'))$('#convert').onclick=convertUnits;if($('#swap'))$('#swap').onclick=()=>{const a=$('#fromUnit'),b=$('#toUnit');const v=a.value;a.value=b.value;b.value=v;convertUnits()};if($('#decode'))$('#decode').onclick=decodeResistor;if($('#bandCount'))$('#bandCount').onchange=()=>{updateBandCount();updateBands()};['b1','b2','b3','mult','tol'].forEach(id=>{if($('#'+id))$('#'+id).onchange=()=>{if(id==='tol')$('#tol').dataset.userChanged='1';updateBands()}});$('#exportText')?.addEventListener('click',()=>exportSaved('text'));$('#exportCsv')?.addEventListener('click',()=>exportSaved('csv'))}
function message(text,error=false){const el=$('#message');if(el){el.textContent=text;el.className='message'+(error?' error':'')}}
function val(id){return num($('#'+id)?.value)}
function setResults(items,formula,diagram){const el=$('#results');if(el)el.innerHTML=items.map(x=>metric(x[0],x[1],x[2]||'')).join('');const f=$('#formula');if(f)f.textContent=formula||'';if(diagram&&$('#diagram'))$('#diagram').innerHTML=diagram;lastResult={tool:activeTool,title:tools.find(t=>t.id===activeTool).name,items,formula,summary:items.map(x=>`${x[0]}: ${x[1]}`).join(' · '),date:Date.now()}}
function calculate(){
 try{
 if(activeTool==='ohms'){
  let V=val('v'),I=val('i'),R=val('r'),P=val('p');
  let known=[V,I,R,P].filter(Number.isFinite).length;if(known<2)throw Error('Enter at least two known values.');if([V,I,R,P].some(x=>Number.isFinite(x)&&x<0))throw Error('Values cannot be negative.');if(Number.isFinite(R)&&R===0)throw Error('Resistance must be greater than zero.');if(Number.isFinite(V)&&Number.isFinite(I)&&Number.isFinite(R)&&Math.abs(V-I*R)>Math.max(.05,Math.abs(V)*.03)&&!Number.isFinite(P))throw Error('The entered voltage, current, and resistance do not agree. Leave one field blank or check your values.');
  if(Number.isFinite(V)&&Number.isFinite(R)){I=V/R;P=V*I}else if(Number.isFinite(V)&&Number.isFinite(I)){if(I===0)throw Error('Current must be above zero to calculate resistance.');R=V/I;P=V*I}else if(Number.isFinite(I)&&Number.isFinite(R)){V=I*R;P=V*I}else if(Number.isFinite(P)&&Number.isFinite(V)){if(V===0)throw Error('Voltage must be above zero to use power with voltage.');I=P/V;R=V/I}else if(Number.isFinite(P)&&Number.isFinite(I)){if(I===0)throw Error('Current must be above zero.');V=P/I;R=V/I}else if(Number.isFinite(P)&&Number.isFinite(R)){I=Math.sqrt(P/R);V=I*R}else throw Error('That combination cannot be solved. Enter a different pair of values.');
  $('#v').value=fmt(V);$('#i').value=fmt(I);$('#r').value=fmt(R);$('#p').value=fmt(P);setResults([['Voltage',fmt(V,'V')],['Current',fmt(I,'A')],['Resistance',fmt(R,'Ω')],['Power',fmt(P,'W')]],'V = I × R  •  P = V × I',circuitSvg);message('Calculation complete. Review the results before using them in a real circuit.');
 }else if(activeTool==='battery'){
  const c=val('cells'),cap=val('capacity'),load=val('load'),u=val('usable');if(!Number.isInteger(c)||c<1||c>14)throw Error('Cell count must be an integer from 1 to 14.');if(!(cap>0&&load>0&&u>0&&u<=100))throw Error('Capacity and load must be positive; usable capacity must be 1–100%.');const nominal=c*3.7,full=c*4.2,wh=nominal*cap/1000,runtime=(cap/1000*u/100)/load*60;setResults([['Nominal voltage',fmt(nominal,'V')],['Fully charged',fmt(full,'V')],['Energy',fmt(wh,'Wh')],['Estimated runtime',fmt(runtime,'min')]],'Energy = nominal V × Ah  •  Runtime = usable Ah ÷ load A');message('Estimate complete. Actual runtime varies with load, battery condition, and cutoff voltage.');
 }else if(activeTool==='gearing'){
  const rpm=val('rpm'),pin=val('pinion'),spur=val('spur'),internal=val('internal'),tire=val('tire');if(!(rpm>0&&pin>0&&spur>0&&internal>0&&tire>0))throw Error('All drivetrain values must be greater than zero.');if(!Number.isInteger(pin)||!Number.isInteger(spur))throw Error('Tooth counts must be whole numbers.');const ratio=spur/pin*internal,wheel=rpm/ratio,kmh=wheel*Math.PI*(tire/1000)*60/1000,mph=kmh/1.609344;setResults([['Final drive ratio',fmt(ratio,':1')],['Wheel RPM',fmt(wheel,'rpm')],['Theoretical speed',fmt($('#speedUnit').value==='mph'?mph:kmh,$('#speedUnit').value==='mph'?'mph':'km/h')],['Speed (mph)',fmt(mph,'mph')]],'Final ratio = (spur ÷ pinion) × internal ratio');message('Theoretical speed assumes no tire growth, slip, drivetrain loss, or load-related RPM drop.');
 }else if(activeTool==='led'){
  const vs=val('supply'),vf=val('forward'),ma=val('current'),margin=val('tolerance');if(!(vs>0&&vf>=0&&ma>0&&margin>=0&&margin<=100))throw Error('Supply must be positive, forward voltage nonnegative, current positive, and margin 0–100%.');if(vf>=vs)throw Error('LED forward voltage must be lower than supply voltage.');const current=ma/1000,calc=(vs-vf)/current,design=calc*(1+margin/100),series=[10,12,15,18,22,27,33,39,47,56,68,82,100,120,150,180,220,270,330,390,470,560,680,820,1000,1200,1500,1800,2200,2700,3300,3900,4700,5600,6800,8200,10000];const decades=[.01,.1,1,10,100,1000];let standard=decades.flatMap(d=>series.map(x=>x*d)).filter(x=>x>=design).sort((a,b)=>a-b)[0];if(!standard)standard=design;const actualI=(vs-vf)/standard,power=actualI*actualI*standard,rating=power<=.125?.25:power<=.25?.5:power<=.5?1:power<=1?2:5;setResults([['Calculated resistance',fmt(calc,'Ω')],['Suggested standard value',fmt(standard,'Ω')],['Resistor power',fmt(power,'W')],['Suggested rating',fmt(rating,'W')]],`R = (Vsupply − VLED) ÷ I  •  With margin: ${fmt(design,'Ω')}`);message(`Suggested standard resistor gives about ${fmt(actualI*1000,'mA')} LED current. Verify resistor power and LED ratings.`);
 }
 }catch(e){message(e.message,true)}
}
function refreshUnitOptions(){const cat=$('#category')?.value||'length';const group=unitGroups[cat];if(!group)return;const opts=group.units.map(u=>`<option value="${u[0]}">${u[1]}</option>`).join('');const from=$('#fromUnit'),to=$('#toUnit');const oldFrom=from.value,oldTo=to.value;from.innerHTML=opts;to.innerHTML=opts;from.value=group.units.some(u=>u[0]===oldFrom)?oldFrom:group.units[0][0];to.value=group.units.some(u=>u[0]===oldTo)?oldTo:group.units[Math.min(1,group.units.length-1)][0]}
function convertUnits(){const cat=$('#category').value,amount=val('amount'),from=$('#fromUnit').value,to=$('#toUnit').value;if(!Number.isFinite(amount)){message('Enter a valid numeric value.',true);return}let result;if(cat==='temp'){const c=from==='C'?amount:from==='F'?(amount-32)*5/9:amount-273.15;result=to==='C'?c:to==='F'?c*9/5+32:c+273.15}else{const group=unitGroups[cat].units,fu=group.find(u=>u[0]===from),tu=group.find(u=>u[0]===to);result=amount*fu[2]/tu[2]}setResults([['Result',fmt(result,to)],['Input',fmt(amount,from)]],`${amount} ${from} = ${fmt(result,to)}`);message('Conversion complete.');}
function updateBandCount(){const five=$('#bandCount')?.value==='5';const b3=$('#b3wrap');if(b3)b3.style.display=five?'block':'none';const tol=$('#tol');if(tol){const valid=five?['Brown','Red','Green','Blue','Violet','Grey']:['Brown','Red','Gold','Silver'];const current=tol.value;tol.innerHTML=(five?[['Brown','±1%'],['Red','±2%'],['Green','±0.5%'],['Blue','±0.25%'],['Violet','±0.1%'],['Grey','±0.05%']]:[['Brown','±1%'],['Red','±2%'],['Gold','±5%'],['Silver','±10%']]).map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('');if(valid.includes(current))tol.value=current;else tol.value=five?'Brown':'Gold';if(!five&&current==='Brown'&&!tol.dataset.userChanged)tol.value='Gold';}}
function updateBands(){const count=$('#bandCount')?.value||'4';const names=count==='5'?[$('#b1')?.value||'Brown',$('#b2')?.value||'Black',$('#b3')?.value||'Black',$('#mult')?.value||'Red',$('#tol')?.value||'Gold']:[$('#b1')?.value||'Brown',$('#b2')?.value||'Black',$('#mult')?.value||'Red',$('#tol')?.value||'Gold'];const wrap=$('#colorBands');if(!wrap)return;wrap.innerHTML=`<svg viewBox="0 0 420 85" role="img" aria-label="Resistor illustration with selected color bands"><rect x="12" y="31" width="396" height="22" rx="11" fill="#b9a17b" stroke="#8c785c"/><path d="M0 42H50 M370 42H420" stroke="currentColor" stroke-width="2"/>${names.map((n,i)=>{const c=resistorColors.find(x=>x.name===n);return `<rect x="${75+i*(count==='5'?57:72)}" y="27" width="19" height="30" rx="2" fill="${c?.c||'#333'}" stroke="#0003"/>`}).join('')}</svg>`}
function decodeResistor(){const count=$('#bandCount').value==='5'?5:4;const get=id=>resistorColors.find(c=>c.name===$('#'+id).value);const b1=get('b1'),b2=get('b2'),b3=get('b3'),m=get('mult'),t=get('tol');if(!b1||!b2||!m||m.mult===undefined&&!Number.isFinite(m.v)) {message('Choose valid colors for all bands.',true);return}let digits=count===5?b1.v*100+b2.v*10+b3.v:b1.v*10+b2.v;let multiplier=m.mult??Math.pow(10,m.v);const ohms=digits*multiplier,tol=t?.tol??(t?.name==='Brown'?1:t?.name==='Red'?2:t?.name==='Green'?.5:t?.name==='Blue'?.25:t?.name==='Violet'?.1:t?.name==='Grey'?.05:5);const low=ohms*(1-tol/100),high=ohms*(1+tol/100);setResults([['Resistance',fmt(ohms,'Ω')],['Tolerance',`±${tol}%`],['Minimum',fmt(low,'Ω')],['Maximum',fmt(high,'Ω')]],`${digits} × ${multiplier} = ${fmt(ohms,'Ω')}`);message('Color code decoded. Confirm the band orientation on the physical resistor.')}
function saveCurrent(){if(!lastResult){if(activeTool==='units'){convertUnits()}else if(activeTool==='resistor'){decodeResistor()}else calculate()}if(!lastResult){message('Calculate a result before saving.',true);return}const item={id:String(Date.now())+Math.random().toString(16).slice(2,6),tool:lastResult.tool,title:lastResult.title,summary:lastResult.summary,formula:lastResult.formula,items:lastResult.items,date:Date.now()};saved.unshift(item);saved=saved.slice(0,100);persist();$('#savedCount').textContent=saved.length;message('Calculation saved to this browser.');}
function exportSaved(type){if(!saved.length){alert('No saved calculations to export yet.');return}let content,mime,ext;if(type==='csv'){const rows=[['Title','Tool','Date','Summary','Formula'],...saved.map(s=>[s.title,s.tool,new Date(s.date).toISOString(),s.summary,s.formula||''])];content=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\r\n');mime='text/csv';ext='csv'}else{content=saved.map(s=>`${s.title}\n${new Date(s.date).toLocaleString()}\n${s.summary}\n${s.formula||''}\n`).join('\n---\n\n');mime='text/plain';ext='txt'}download(content,`benchtools-saved.${ext}`,mime)}
function download(content,name,mime){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([content],{type:mime}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCurrent(){if(lastResult){download(`${lastResult.title}\n${lastResult.summary}\n${lastResult.formula||''}\n`,`benchtools-result.txt`,'text/plain')}else exportSaved('text')}
$('#exportTop').onclick=exportCurrent;
$('#search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();if(!q){if(page==='home'){$$('#toolCards .tool-card').forEach(c=>c.style.display='')}return}const matches=tools.filter(t=>(t.name+' '+t.desc+' '+t.tag).toLowerCase().includes(q));if(matches.length===1){page='tool';activeTool=matches[0].id;render();$('#search').value=q}else if(page!=='home'){page='home';render()}if(page==='home'){$$('#toolCards .tool-card').forEach(c=>c.style.display=c.textContent.toLowerCase().includes(q)?'':'none');const cards=$('#toolCards');if(cards&&!matches.length)cards.innerHTML='<div class="empty">No tools match that search.</div>'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#search')===document.activeElement){$('#search').value='';$('#search').dispatchEvent(new Event('input'))}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus()}});
render();
})();
</script>
